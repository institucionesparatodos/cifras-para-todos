# Igual que en boe-para-todos: n8n sube datos/lotes/<lote>.json (cifras + textos ya verificados),
# esta Action genera los JPEG, los publica en GitHub Pages y llama a la resume URL del lote.
name: render
on:
  push:
    paths: ["datos/lotes/**.json"]
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: datos, cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Renderizar lotes nuevos
        run: |
          git diff --name-only HEAD~1 HEAD -- 'datos/lotes/*.json' > /tmp/lotes.txt
          for f in $(cat /tmp/lotes.txt); do
            lote=$(basename "$f" .json)
            python -m render.render "$f" "docs/$lote"
            python -m render.hoja "docs/$lote"
          done
      - name: Publicar en Pages y avisar a n8n
        run: |
          git config user.name "cifras-bot"; git config user.email "institucionesparatodos@gmail.com"
          git add docs/ && git commit -m "Imágenes" && git push || true
          sleep 40   # tiempo para que GitHub Pages sirva las imágenes nuevas
          for f in $(cat /tmp/lotes.txt); do
            url=$(python -c "import json;print(json.load(open('$f')).get('resume_url',''))")
            [ -n "$url" ] && curl -s -X POST "$url" -H 'Content-Type: application/json' -d "{\"lote\":\"$(basename $f .json)\"}"
          done
